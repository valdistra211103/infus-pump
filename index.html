<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Monitor Infus Pump</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f5ff, #f8fbff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .header {
      background: white;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .header h1 {
      color: #0879b8;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .header p {
      color: #777;
      font-size: 15px;
    }

    .status {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 25px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 16px;
      background: #eeeeee;
      color: #555;
    }

    .status.running {
      background: #d9f8e3;
      color: #159447;
    }

    .status.stopped {
      background: #ffe0e0;
      color: #d93030;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .card h2 {
      color: #555;
      font-size: 18px;
      margin-bottom: 15px;
    }

    .value {
      font-size: 42px;
      font-weight: bold;
      color: #0879b8;
    }

    .unit {
      font-size: 18px;
      color: #777;
      margin-left: 5px;
    }

    .target {
      margin-top: 12px;
      color: #888;
      font-size: 14px;
    }

    .remaining-box {
      margin-top: 20px;
      background: #f1f8fc;
      border-radius: 15px;
      padding: 15px;
    }

    .progress-container {
      width: 100%;
      height: 18px;
      background: #e0e0e0;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: #159bd3;
      border-radius: 20px;
      transition: width 0.5s ease;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 20px;
    }

    .connection {
      margin-top: 8px;
    }

    .online {
      color: #159447;
      font-weight: bold;
    }

    .offline {
      color: #d93030;
      font-weight: bold;
    }

    @media (max-width: 650px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 25px;
      }

      .value {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">

      <h1>💧 MONITOR INFUS PUMP</h1>

      <p>Monitoring Kecepatan dan Sisa Cairan Infus</p>

      <div id="status" class="status">
        ● MENGHUBUNGKAN...
      </div>

    </div>


    <!-- DATA -->
    <div class="cards">

      <!-- KECEPATAN AKTUAL -->
      <div class="card">

        <div class="icon">⚡</div>

        <h2>KECEPATAN INFUS</h2>

        <div>
          <span id="flow" class="value">0</span>
          <span class="unit">mL/h</span>
        </div>

        <div class="target">
          Pengaturan: <b><span id="inputFlow">0</span> mL/h</b>
        </div>

      </div>


      <!-- SISA INFUS -->
      <div class="card">

        <div class="icon">🧴</div>

        <h2>SISA CAIRAN INFUS</h2>

        <div>
          <span id="remaining" class="value">0</span>
          <span class="unit">mL</span>
        </div>

        <div class="remaining-box">

          <div>
            Sisa cairan
          </div>

          <div class="progress-container">
            <div id="progress" class="progress"></div>
          </div>

          <div style="margin-top:8px;">
            <span id="percentage">0</span>%
          </div>

        </div>

      </div>

    </div>


    <!-- FOOTER -->
    <div class="footer">

      <div>
        Sistem Monitoring Infus Pump Berbasis IoT
      </div>

      <div class="connection">
        Koneksi Firebase:
        <span id="connection" class="offline">
          Menghubungkan...
        </span>
      </div>

    </div>

  </div>


  <script>

    // ==========================================
    // FIREBASE CONFIGURATION
    // ==========================================

    const firebaseConfig = {

      apiKey: "AIzaSyBHI_FW51I3Nv240-5VNuHxFL_Zn90WT6M",

      authDomain: "infuspump-distra.firebaseapp.com",

      databaseURL:
        "https://infuspump-distra-default-rtdb.firebaseio.com",

      projectId: "infuspump-distra",

      storageBucket:
        "infuspump-distra.firebasestorage.app",

      messagingSenderId: "1006570621710",

      appId:
        "1:1006570621710:web:ff3fa793e933d36acee55f",

      measurementId: "G-52ZL8LRNXY"

    };


    // ==========================================
    // INITIALIZE FIREBASE
    // ==========================================

    firebase.initializeApp(firebaseConfig);

    const database = firebase.database();


    // ==========================================
    // REFERENSI DATA FIREBASE
    // ==========================================

    const dbRef = database.ref();


    // ==========================================
    // MEMBACA DATA REALTIME
    // ==========================================

    dbRef.on("value", function(snapshot) {

      const data = snapshot.val();

      if (!data) {
        console.log("Data Firebase kosong");
        return;
      }


      // ------------------------------------------
      // FLOW AKTUAL
      // ------------------------------------------

      let flow = Number(data.flow || 0);

      document.getElementById("flow").innerText =
        flow.toFixed(0);


      // ------------------------------------------
      // INPUT FLOW
      // ------------------------------------------

      let inputFlow = Number(data.inputFlow || 0);

      document.getElementById("inputFlow").innerText =
        inputFlow.toFixed(0);


      // ------------------------------------------
      // SISA CAIRAN
      // ------------------------------------------

      let remaining = Number(data.remaining || 0);

      document.getElementById("remaining").innerText =
        remaining.toFixed(0);


      // ------------------------------------------
      // STATUS
      // ------------------------------------------

      let status = String(data.status || "STOPPED");

      const statusElement =
        document.getElementById("status");


      if (status.toUpperCase() === "RUNNING") {

        statusElement.innerText = "● INFUS BERJALAN";

        statusElement.className =
          "status running";

      } else {

        statusElement.innerText = "● INFUS BERHENTI";

        statusElement.className =
          "status stopped";

      }


      // ------------------------------------------
      // PROGRESS SISA INFUS
      // ------------------------------------------

      // Kapasitas awal infus.
      // Silakan ubah misalnya 500 jika menggunakan
      // botol infus 500 mL.

      const kapasitasAwal = 500;

      let percentage =
        (remaining / kapasitasAwal) * 100;


      // Batasi 0 - 100%

      if (percentage > 100) {
        percentage = 100;
      }

      if (percentage < 0) {
        percentage = 0;
      }


      document.getElementById("percentage").innerText =
        percentage.toFixed(0);


      document.getElementById("progress").style.width =
        percentage + "%";

    });


    // ==========================================
    // CEK KONEKSI FIREBASE
    // ==========================================

    const connectedRef =
      database.ref(".info/connected");


    connectedRef.on("value", function(snapshot) {

      const connection =
        document.getElementById("connection");


      if (snapshot.val() === true) {

        connection.innerText = "ONLINE";

        connection.className = "online";

      } else {

        connection.innerText = "OFFLINE";

        connection.className = "offline";

      }

    });

  </script>

</body>
</html>
