<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monitor Infus Pump</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef5f9;
            color: #1f2937;
        }

        .header {
            background: #1976d2;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 15px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .title {
            font-size: 17px;
            color: #6b7280;
            margin-bottom: 12px;
        }

        .value {
            font-size: 42px;
            font-weight: bold;
            color: #1976d2;
        }

        .unit {
            margin-top: 5px;
            color: #6b7280;
            font-size: 15px;
        }

        .status {
            font-size: 30px;
            font-weight: bold;
        }

        .running {
            color: #16a34a;
        }

        .stopped {
            color: #dc2626;
        }

        .alarm {
            color: #dc2626;
        }

        .connection {
            margin-top: 25px;
            padding: 15px;
            background: white;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .online {
            color: #16a34a;
        }

        .offline {
            color: #dc2626;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 700px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 23px;
            }

            .value {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>💧 MONITOR INFUS PUMP</h1>
        <p>Monitoring Cairan Infus Secara Realtime</p>
    </div>


    <div class="container">

        <div class="cards">

            <!-- FLOW -->
            <div class="card">

                <div class="icon">💧</div>

                <div class="title">
                    Kecepatan Aliran
                </div>

                <div class="value">
                    <span id="flow">0</span>
                </div>

                <div class="unit">
                    mL/h
                </div>

            </div>


            <!-- REMAINING -->
            <div class="card">

                <div class="icon">🧪</div>

                <div class="title">
                    Sisa Cairan Infus
                </div>

                <div class="value">
                    <span id="remaining">0</span>
                </div>

                <div class="unit">
                    mL
                </div>

            </div>


            <!-- STATUS -->
            <div class="card">

                <div class="icon">⚙️</div>

                <div class="title">
                    Status Pompa
                </div>

                <div id="status" class="status">
                    -
                </div>

                <div class="unit">
                    Kondisi Sistem
                </div>

            </div>

        </div>


        <!-- CONNECTION -->
        <div id="connection" class="connection offline">
            🔄 Menghubungkan ke Firebase...
        </div>


        <div class="footer">
            Sistem Monitoring Infus Pump Berbasis IoT
        </div>

    </div>


    <!-- ================================================= -->
    <!-- FIREBASE -->
    <!-- ================================================= -->

    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getDatabase,
            ref,
            onValue
        }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


        // =================================================
        // FIREBASE CONFIG
        // =================================================

        const firebaseConfig = {

            apiKey: "AIzaSyBHI_FW51I3Nv240-5VNuHxFL_Zn90wT6M",

            authDomain:
            "infustpump-distra.firebaseapp.com",

            databaseURL:
            "https://infustpump-distra-default-rtdb.firebaseio.com",

            projectId:
            "infustpump-distra",

            storageBucket:
            "infustpump-distra.firebasestorage.app",

            messagingSenderId:
            "1006570621710",

            appId:
            "1:1006570621710:web:ff3fa793e933d36acee55f"

        };


        // =================================================
        // INISIALISASI FIREBASE
        // =================================================

        const app = initializeApp(firebaseConfig);

        const database = getDatabase(app);


        // =================================================
        // REFERENSI DATABASE
        // =================================================

        const infusRef = ref(database, "infus");


        // =================================================
        // MEMBACA DATA FIREBASE REALTIME
        // =================================================

        onValue(

            infusRef,

            (snapshot) => {

                const data = snapshot.val();


                console.log("Data Firebase:");
                console.log(data);


                if (!data) {

                    document.getElementById("flow").innerText = "0";

                    document.getElementById("remaining").innerText = "0";

                    document.getElementById("status").innerText = "-";

                    document.getElementById("connection").innerText =
                        "🟡 Data Firebase kosong";

                    return;
                }


                // =================================================
                // FLOW
                // =================================================

                if (data.flow !== undefined) {

                    document.getElementById("flow").innerText =
                        data.flow;

                }


                // =================================================
                // REMAINING
                // =================================================

                if (data.remaining !== undefined) {

                    document.getElementById("remaining").innerText =
                        data.remaining;

                }


                // =================================================
                // STATUS
                // =================================================

                if (data.status !== undefined) {

                    const statusElement =
                        document.getElementById("status");

                    const status =
                        String(data.status).toUpperCase();


                    statusElement.innerText = status;


                    // Hapus class sebelumnya
                    statusElement.classList.remove(
                        "running",
                        "stopped",
                        "alarm"
                    );


                    // RUNNING
                    if (status === "RUNNING") {

                        statusElement.classList.add("running");

                    }


                    // STOPPED
                    else if (status === "STOPPED") {

                        statusElement.classList.add("stopped");

                    }


                    // ALARM
                    else {

                        statusElement.classList.add("alarm");

                    }

                }


                // =================================================
                // STATUS KONEKSI
                // =================================================

                const connection =
                    document.getElementById("connection");

                connection.innerText =
                    "🟢 Terhubung ke Firebase — Data Realtime";

                connection.classList.remove("offline");

                connection.classList.add("online");

            },


            // =================================================
            // ERROR FIREBASE
            // =================================================

            (error) => {

                console.error(
                    "Firebase Error:",
                    error
                );


                const connection =
                    document.getElementById("connection");


                connection.innerText =
                    "🔴 Gagal terhubung ke Firebase";


                connection.classList.remove("online");

                connection.classList.add("offline");

            }

        );

    </script>

</body>
</html>
